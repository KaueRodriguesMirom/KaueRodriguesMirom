name: Generate pacman animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # 1. Baixa os seus arquivos atuais (CRÍTICO para não apagar o seu README)
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Gera a animação do Pacman
      - name: Generate pacman-contribution-graph.svg
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: KaueRodriguesMirom

      # 3. Move a imagem e salva com segurança na branch main
      - name: Commit & Push to main
        run: |
          # Se a imagem foi gerada numa pasta dist, move para a raiz
          if [ -d "dist" ]; then cp dist/*.svg ./ || true; fi
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add *.svg
          git commit -m "Atualiza animação do Pacman na main" || echo "Sem mudanças para salvar"
          git push origin main
